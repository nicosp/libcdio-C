name: Windows, MinGW

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: windows-latest

    strategy:
      matrix:
        include:
          - { sys: mingw64, env: x86_64 }
          - { sys: mingw32, env: i686 }
          - { sys: ucrt64,  env: ucrt-x86_64, exe: rufus_ucrt.exe }

    defaults:
      run:
        shell: msys2 {0}

    steps:
    - uses: actions/checkout@v7

    - name: Setup
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.sys }}
        update: true
        install: >-
          mingw-w64-${{ matrix.env }}-toolchain
          base-devel
          autotools
          texinfo
          help2man

    - name: Build
      run: |
        ./autogen.sh
        make -j4

    - name: Test
      run: make check

    - name: Link a program against the static and the shared libcdio
      # MinGW programs must link either library without defining
      # CDIO_STATIC.  Use variables as well as a function: variables are
      # what needs __declspec(dllimport) under MSVC.
      run: |
        cat > link-test.c <<'TEST'
        #include <stdio.h>
        #include <cdio/cdio.h>
        #include <cdio/version.h>
        int main(void) {
          printf("%s %u %s\n", cdio_version_string, libcdio_version_num,
                 cdio_driver_describe(DRIVER_BINCUE));
          return cdio_have_driver(DRIVER_BINCUE) ? 0 : 1;
        }
        TEST
        gcc -Iinclude -o link-static.exe link-test.c lib/driver/.libs/libcdio.a -liconv -lwinmm
        ./link-static.exe
        # The static library must not make the program export libcdio's
        # functions.
        if objdump -p link-static.exe | grep -q 'cdio_'; then
          echo "link-static.exe exports or imports libcdio symbols:"
          objdump -p link-static.exe | grep 'cdio_'
          exit 1
        fi
        gcc -Iinclude -o link-shared.exe link-test.c lib/driver/.libs/libcdio.dll.a
        PATH="$PWD/lib/driver/.libs:$PATH" ./link-shared.exe
